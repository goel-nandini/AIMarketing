<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="60%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="1280" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="612" cy="256" r="251.99999999999997" fill="#48cae4" opacity="0.22" filter="url(#glow)" />
  <circle cx="108" cy="960" r="216" fill="#1c2541" opacity="0.3" filter="url(#glow)" />

  <!-- Subtle Grid Lines for High-Tech Aesthetic -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="320" x2="720" y2="320" />
    <line x1="0" y1="640" x2="720" y2="640" />
    <line x1="0" y1="960" x2="720" y2="960" />
    <line x1="180" y1="0" x2="180" y2="1280" />
    <line x1="360" y1="0" x2="360" y2="1280" />
    <line x1="540" y1="0" x2="540" y2="1280" />
  </g>

  <!-- Brand & Category Tag -->
  <g transform="translate(48, 56)">
    <rect width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#48cae4" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
      HEALTHCARE CONSULTATION
    </text>
  </g>

  <!-- Location Tag -->
  <g transform="translate(520, 56)">
    <rect width="152" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="76" y="22" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      📍 Toronto, ON
    </text>
  </g>

  <!-- Center Visual Card (Glassmorphism Effect) -->
  <rect x="40" y="230.39999999999998" width="640" height="576" rx="24" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />
  
  <!-- Optical Graphic / Icon Ring inside Card -->
  <circle cx="360" cy="486.4" r="100.80000000000001" fill="none" stroke="#48cae4" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.7" />
  <circle cx="360" cy="486.4" r="72" fill="rgba(37, 99, 235, 0.15)" stroke="#60a5fa" stroke-width="2" />
  <circle cx="360" cy="486.4" r="8" fill="#ffffff" />
  
  <!-- Trust Badge Over Card -->
  <g transform="translate(240, 665.6)">
    <rect width="240" height="38" rx="19" fill="#0f172a" stroke="#48cae4" stroke-width="1.5" />
    <text x="120" y="24" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">
      ★ TOP-RATED CLINIC
    </text>
  </g>

  <!-- Headline -->
  <text x="48" y="896" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="37.44" font-weight="800" letter-spacing="-0.5">
    Active Lifestyle Freedom
  </text>
  <text x="48" y="940" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="37.44" font-weight="800" letter-spacing="-0.5">Concept</text>

  <!-- Subheadline -->
  <text x="48" y="1049.6" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
    Personalized healthcare consultation treatments
  </text>

  <!-- Call To Action Button -->
  <g transform="translate(48, 1126.4)">
    <rect width="260" height="56" rx="28" fill="url(#btnGrad)" />
    <text x="130" y="35" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.2">
      Book Free Consultation →
    </text>
  </g>

  <!-- Gemini AI Watermark -->
  <text x="672" y="1203.1999999999998" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
    ✨ Generated with Google Gemini AI
  </text>
</svg>