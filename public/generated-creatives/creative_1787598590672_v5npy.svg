<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071c24" />
      <stop offset="60%" stop-color="#0f5a6b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="200" r="280" fill="#22d3ee" opacity="0.22" filter="url(#glow)" />
  <circle cx="120" cy="750" r="240" fill="#0f5a6b" opacity="0.3" filter="url(#glow)" />

  <!-- Subtle Grid Lines for High-Tech Aesthetic -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="750" x2="800" y2="750" />
    <line x1="200" y1="0" x2="200" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="600" y1="0" x2="600" y2="1000" />
  </g>

  <!-- Brand & Category Tag -->
  <g transform="translate(48, 56)">
    <rect width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#22d3ee" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
      COSMETIC DENTISTRY
    </text>
  </g>

  <!-- Location Tag -->
  <g transform="translate(600, 56)">
    <rect width="152" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="76" y="22" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      📍 Vancouver, BC
    </text>
  </g>

  <!-- Center Visual Card (Glassmorphism Effect) -->
  <rect x="40" y="180" width="720" height="450" rx="24" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />
  
  <!-- Optical Graphic / Icon Ring inside Card -->
  <circle cx="400" cy="380" r="112.00000000000001" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.7" />
  <circle cx="400" cy="380" r="80" fill="rgba(37, 99, 235, 0.15)" stroke="#60a5fa" stroke-width="2" />
  <circle cx="400" cy="380" r="8" fill="#ffffff" />
  
  <!-- Trust Badge Over Card -->
  <g transform="translate(280, 520)">
    <rect width="240" height="38" rx="19" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" />
    <text x="120" y="24" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">
      ★ 5-STAR RATED CLINIC
    </text>
  </g>

  <!-- Headline -->
  <text x="48" y="700" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Reveal Your Most Confident
  </text>
  <text x="48" y="744" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Radiant Smile</text>

  <!-- Subheadline -->
  <text x="48" y="820" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
    Personalized cosmetic dentistry and full smile
  </text>

  <!-- Call To Action Button -->
  <g transform="translate(48, 880)">
    <rect width="260" height="56" rx="28" fill="url(#btnGrad)" />
    <text x="130" y="35" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.2">
      Book Consultation →
    </text>
  </g>

  <!-- Gemini AI Watermark -->
  <text x="752" y="940" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
    ✨ Generated with Google Gemini AI
  </text>
</svg>